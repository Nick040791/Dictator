name: CI

on:
  push:
    branches: [stable, main]
  pull_request:
    branches: [stable, main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check dictator.py tests/
      - name: Ruff format (check only)
        run: ruff format --check dictator.py tests/

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system audio deps
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Byte-compile
        run: python -m py_compile dictator.py
      - name: Run tests
        run: PYTHONPATH=. pytest -q

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          set -e
          for f in install.sh scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"
          ignore: SC1091

  docker:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008: unpinned apt packages -- tolerated for CUDA base image freshness
          ignore: DL3008
