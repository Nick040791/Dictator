services:
  dictator:
    build:
      context: .
      dockerfile: Dockerfile
    image: dictator:latest
    container_name: dictator
    restart: unless-stopped
    network_mode: "host"       # Direct host networking for local Ollama
    ipc: "host"                # Shared RAM-disk (/dev/shm) for audio transfers
    environment:
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - OLLAMA_URL=http://127.0.0.1:11434/api/generate
      - OLLAMA_MODEL=bonsai-2:2b
      - SAMPLE_RATE=16000
    devices:
      - /dev/snd:/dev/snd      # Microphone hardware
      - /dev/input:/dev/input  # Intercepts keyboard events under Wayland
    group_add:
      - input                  # Grants access to /dev/input event files
      - audio                  # Grants direct ALSA hardware access
    volumes:
      # Pass through the Wayland IPC socket for clipboard operations
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:ro
      # RAM buffer for WAV audio transcription
      - /dev/shm:/dev/shm
      # Live script mount
      - ./dictator.py:/app/dictator.py:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]